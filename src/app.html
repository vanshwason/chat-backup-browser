<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		
		<!-- Favicon -->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		
		<!-- Theme color for browser chrome -->
		<meta name="theme-color" content="#075e54" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)" />
		
		<!-- App meta -->
		<meta name="description" content="Browse your WhatsApp chat exports offline on desktop and phone: media, search, stats and bookmarks. 100% private. Not affiliated with WhatsApp or Meta." />
		<meta name="application-name" content="Chat Backup Browser" />
		<meta name="apple-mobile-web-app-title" content="Chat Backup" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="mobile-web-app-capable" content="yes" />
		
		<!-- Open Graph meta tags for social media -->
		<!-- Primary OG image (1200x630px) for Facebook, LinkedIn, Discord -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://vanshwason.github.io/chat-backup-browser/" />
		<meta property="og:title" content="Chat Backup Browser - Browse your WhatsApp chat exports" />
		<meta property="og:description" content="Browse your WhatsApp chat exports offline on desktop and phone: media, search, stats and bookmarks. 100% private. Not affiliated with WhatsApp or Meta." />
		<meta property="og:image" content="https://vanshwason.github.io/chat-backup-browser/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Chat Backup Browser - browse your chat exports offline, 100% private" />
		<meta property="og:site_name" content="Chat Backup Browser" />
		<!-- Secondary square image for WhatsApp and other messaging apps -->
		<meta property="og:image" content="https://vanshwason.github.io/chat-backup-browser/og-image-square.png" />
		<meta property="og:image:width" content="800" />
		<meta property="og:image:height" content="800" />
		
		<!-- Twitter Card meta tags -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:url" content="https://vanshwason.github.io/chat-backup-browser/" />
		<meta name="twitter:title" content="Chat Backup Browser - Browse your WhatsApp chat exports" />
		<meta name="twitter:description" content="Browse your WhatsApp chat exports offline on desktop and phone: media, search, stats and bookmarks. 100% private. Not affiliated with WhatsApp or Meta." />
		<meta name="twitter:image" content="https://vanshwason.github.io/chat-backup-browser/og-image.png" />
		<meta name="twitter:image:alt" content="Chat Backup Browser - browse your chat exports offline, 100% private" />
		
		<!-- Security -->
		<meta name="referrer" content="no-referrer" />
		
		<script>
			// Initialize dark mode before page renders to prevent flash
			(function() {
				const stored = localStorage.getItem('theme');
				if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
